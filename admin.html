<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fresh Cut Admin</title>
<style>
:root{--g:#15703a;--gd:#0e4a26;--y:#f7c948;--bg:#f4f6ef;--line:#e2e6d8;--mut:#61705f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1b2a1f}
button{font-family:inherit;cursor:pointer}
.top{background:var(--gd);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:18px}.top button{background:transparent;color:#fff;border:1px solid #ffffff88;border-radius:8px;padding:6px 12px}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.wrap{max-width:900px;margin:auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #c9d1bd;border-radius:8px;font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700;margin-top:12px}
.btn.s{background:#fff;color:var(--g);border:1px solid var(--g);margin:0;padding:6px 10px;font-size:13px}
.btn.d{background:#fff;color:#b3261e;border:1px solid #b3261e;margin:0;padding:6px 10px;font-size:13px}
.btn.w{background:#25D366}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img,.item .ph{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eef3e6;display:grid;place-items:center;flex:none}
.item .m{flex:1;min-width:0}.item small{color:var(--mut)}
.item input.p{width:80px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef3e6}
.st-New{background:#fff1c2}.st-Preparing{background:#dbeafe}.st-Delivered{background:#d5f0dc}.st-Cancelled{background:#f8d7d4}
.ord{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ord ul{margin:6px 0;padding-left:18px}
#login{max-width:360px;margin:60px auto;padding:0 16px}
.msg{color:#b3261e;font-size:14px;margin-top:8px}.ok{color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.chip{display:flex;align-items:center;gap:6px;margin:0;border:1px solid #c9d1bd;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;background:#fff}.chip input{width:auto}
.stk{display:flex;align-items:center;gap:5px;margin:0;font-size:13px;white-space:nowrap}.stk input{width:auto}
.tag.no{background:#f8d7d4}.tag.hid{background:#e5e5e5}.hint{color:var(--mut);font-size:13px;margin:4px 0 0}
.bprev{width:100%;max-width:420px;aspect-ratio:16/6;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.crow input{width:80px;padding:6px 8px}.crow span:first-child{font-weight:700;flex:1}.cpv{margin-top:8px}
.bulk p{margin:4px 0}.bulk ul{margin:6px 0;padding-left:18px;font-size:14px;max-height:260px;overflow:auto}.bulk .bad{color:#b3261e}.fbtn{display:inline-block;cursor:pointer;margin:0 0 0 6px}.fbtn input{display:none}
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.cpc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.cpc .ci{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(160deg,#f1f8e8,#fff6d8);font-size:44px}.cpc .ci img{width:100%;height:100%;object-fit:cover}.cpc .cb{padding:10px}.cpc .cb b{display:block}.cpc .cb small{color:var(--mut)}.cpc .row{margin-top:8px;gap:6px}
.prev{width:110px;height:110px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div id="login"><div class="box">
 <h2>Fresh Cut Admin</h2>
 <label for="em">Email</label><input id="em" type="email" autocomplete="username">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="btn" id="lg">Log in</button><div class="msg" id="lm"></div>
</div></div>

<div id="app" style="display:none">
 <div class="top"><b>🥕 Fresh Cut Admin</b><span><a href="index.html" style="color:#fff;margin-right:12px">View store</a><button id="lo">Log out</button></span></div>
 <div class="tabs" id="tabs"></div>
 <div class="wrap" id="view"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyATqn1InnyTkyHqIfbLw4LZQ4fGLzwf52A",authDomain:"freshcut-e85c7.firebaseapp.com",projectId:"freshcut-e85c7",storageBucket:"freshcut-e85c7.firebasestorage.app",messagingSenderId:"591946013615",appId:"1:591946013615:web:7812e8cd886d33e6992d5a"});
const db=getFirestore(app),auth=getAuth(app);
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TABS=["Orders","Products","Cutting Photos","Services","Store Info","Reviews","Festival & Wishes"];
const FORMTABS=["Products","Services","Store Info","Reviews"];
const cx=(p,c)=>{const v=(p.cutx||{})[c];return v!==undefined&&v!==""?Number(v):(p.cutAdd!==undefined?Number(p.cutAdd):5)};
const CUTS=["Sliced","Long strips","Small cubes","Round slices","Fine chop","Wedges","Grated","Whole (peeled)"];
let BU=null,BM="",CP={},CPL=[],CPM="";
let tab="Orders",P=[],O=[],S=[],ST={},img="",editId="",started=false,bimg;

$("lg").onclick=async()=>{$("lm").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("lm").textContent="Wrong email or password."}};
$("lo").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 $("login").style.display=u?"none":"block";$("app").style.display=u?"block":"none";
 if(u&&!started){started=true;listen()}
});
function listen(){
 const err=e=>{console.error(e);alert("Permission problem: please check the Firestore rules.")};
 onSnapshot(collection(db,"products"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.cat).localeCompare(b.cat)||String(a.name).localeCompare(b.name));draw()},err);
 onSnapshot(collection(db,"services"),s=>{S=s.docs.map(d=>({id:d.id,...d.data()}));draw()},err);
 onSnapshot(collection(db,"orders"),s=>{O=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()},err);
 onSnapshot(doc(db,"settings","cutphotos"),s=>{CP=(s.exists()&&s.data().imgs)||{};if(tab=="Cutting Photos")draw()},e=>console.error(e));
 onSnapshot(doc(db,"settings","site"),s=>{ST=s.exists()?s.data():{};if((tab.startsWith("Fest")||tab=="Store Info"||tab=="Reviews")&&!document.activeElement.closest?.("#view"))draw()},err);
}
function draw(){
 $("tabs").innerHTML=TABS.map(t=>'<button class="tab'+(t==tab?" on":"")+'" data-t="'+t+'">'+t+(t=="Orders"?" ("+O.filter(o=>o.status=="New").length+" new)":"")+"</button>").join("");
 if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#view")&&(FORMTABS.includes(tab)||tab.startsWith("Fest"))&&document.activeElement.tagName!=="BODY")return;
 $("view").innerHTML=tab=="Orders"?vOrders():tab=="Products"?vProducts():tab=="Cutting Photos"?vCutPhotos():tab=="Services"?vServices():tab=="Store Info"?vInfo():tab=="Reviews"?vReviews():vFest();
 if(tab=="Products"){prev();cutRows()}
 if(tab=="Store Info")bprev();
}
$("tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;editId="";BU=null;BM="";CPM="";img="";bimg=undefined;$("view").innerHTML="";draw()}};
const wa=(ph,m)=>{ph=String(ph||"").replace(/\D/g,"");if(ph.length==10)ph="91"+ph;return "https://wa.me/"+ph+"?text="+encodeURIComponent(m)};

function vOrders(){
 if(!O.length)return '<div class="box">No orders yet. New orders will appear here automatically.</div>';
 return O.map(o=>{
  const t=o.createdAt?new Date(o.createdAt.seconds*1000).toLocaleString("en-IN"):"";
  return '<div class="ord"><div class="row"><b>'+esc(o.name)+'</b><span class="tag st-'+esc(o.status)+'">'+esc(o.status)+"</span><small>"+t+'</small></div>'
  +'<div><a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+"</a> · "+esc(o.address)+"</div><ul>"+(o.items||[]).map(i=>"<li>"+esc(i.n)+" ("+esc(i.u)+(i.c?", "+esc(i.c):"")+") × "+i.q+" = ₹"+i.p*i.q+"</li>").join("")+"</ul>"
  +"<div><b>Total ₹"+o.total+"</b> · "+esc(o.payment||o.pay)+'</div><div class="row" style="margin-top:8px">'
  +'<select data-os="'+o.id+'" style="width:auto">'+["New","Preparing","Delivered","Cancelled"].map(s=>"<option"+(s==o.status?" selected":"")+">"+s+"</option>").join("")+"</select>"
  +'<a class="btn s" target="_blank" href="'+wa(o.phone,"Hello "+o.name+", your Fresh Cut order (Rs."+o.total+") is confirmed. Thank you!")+'">WhatsApp customer</a>'
  +'<button class="btn d" data-od="'+o.id+'">Delete</button></div></div>';
 }).join("");
}
function vProducts(){
 const cats=[...new Set(["Vegetables","Fruits","Mixed & Salad","Ready to Cook","Combo Packs",...P.map(p=>p.cat).filter(Boolean)])];
 const e=P.find(p=>p.id==editId)||{};
 const ec=Array.isArray(e.cuts)?e.cuts:[];
 const other=ec.filter(c=>!CUTS.includes(c)).join(", ");
 return vBulk()+'<div class="box"><h2>'+(editId?"Edit product":"Add new product")+"</h2>"
 +'<label>Name</label><input id="pn" value="'+esc(e.name)+'">'
 +'<div class="g2"><div><label>Category</label><input id="pc" list="cl" value="'+esc(e.cat||"Vegetables")+'"><datalist id="cl">'+cats.map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></div>'
 +'<div><label>Pack size (e.g. 500 g)</label><input id="pu" value="'+esc(e.unit)+'"></div></div>'
 +'<label>Cutting type (tick one or more; customers choose if you tick several)</label><div class="chips">'+CUTS.map(c=>'<label class="chip"><input type="checkbox" class="cutck" value="'+esc(c)+'"'+(ec.includes(c)?" checked":"")+'>'+esc(c)+"</label>").join("")+"</div>"
 +'<label>Other cutting types (optional, separate with commas)</label><input id="po" placeholder="e.g. Thin sticks, Half moons" value="'+esc(other)+'">'
 +'<div class="g2"><div><label>Cutting charge (₹) added to the price of every cutting type</label><input id="pk" type="number" min="0" value="'+esc(e.cutAdd??5)+'"></div><div></div></div>'
 +'<div id="cpv" class="cpv"></div><p class="hint">Cut prices are worked out automatically: base price + cutting charge. To give one cut a different extra amount, type it in that cut\'s row. When you change the base price, every cut price updates by itself.</p>'
 +'<label>What is inside / short note (optional)</label><input id="pd" placeholder="e.g. Carrot + Beans + Potato + Onion" value="'+esc(e.desc)+'">'
 +'<div class="g2"><div><label>Base price (₹) for the plain item</label><input id="pp" type="number" min="0" value="'+esc(e.price)+'"></div>'
 +'<div><label>Best within (optional)</label><input id="pb" placeholder="e.g. 2 days" value="'+esc(e.shelf)+'"></div></div>'
 +'<label>Photo</label><input id="pf" type="file" accept="image/*">'
 +'<img class="prev" id="pv"><label><input type="checkbox" id="pa" style="width:auto" '+(e.active===false?"":"checked")+'> In stock (untick to show as Out of stock)</label>'
 +'<label><input type="checkbox" id="px" style="width:auto" '+(e.hide?"checked":"")+'> Hide this item from the store completely</label>'
 +'<button class="btn" id="ps">'+(editId?"Save changes":"Add product")+'</button> '+(editId?'<button class="btn s" id="pcx">Cancel</button>':"")+'<div class="msg ok" id="pm"></div></div>'
 +'<div class="box"><h2>All products ('+P.length+")</h2>"
 +(P.length?"":'<p>No products yet. Add your first one above, or <button class="btn s" id="seed">add starter products</button> and edit them afterwards.</p>')
 +P.map(p=>'<div class="item">'+(p.img?'<img src="'+p.img+'">':'<div class="ph">🥬</div>')
 +'<div class="m"><b>'+esc(p.name)+"</b> "+(p.active===false?'<span class="tag no">Out of stock</span> ':"")+(p.hide?'<span class="tag hid">Hidden</span>':"")+"<br><small>"+esc(p.cat)+" · "+esc(p.unit)+(Array.isArray(p.cuts)&&p.cuts.length?" · Cut: "+esc(p.cuts.map(c=>c+" ₹"+(p.price+cx(p,c))).join(", ")):"")+"</small></div>"
 +'<label class="stk"><input type="checkbox" data-pa="'+p.id+'"'+(p.active===false?"":" checked")+'> In stock</label>'
 +'₹<input class="p" type="number" min="0" value="'+p.price+'" data-pr="'+p.id+'">'
 +'<button class="btn s" data-pe="'+p.id+'">Edit</button><button class="btn d" data-pd="'+p.id+'">Delete</button></div>').join("")+"</div>";
}
/* ---------- Bulk update with Excel ---------- */
const XF=[["id","Product ID (do not change)"],["name","Name"],["cat","Category"],["unit","Pack size"],["price","Base price (₹)"],["cuts","Cutting types (separate with commas)"],["cutAdd","Cutting charge (₹)"],["cutx","Special cut charges (e.g. Grated=10)"],["active","In stock (Yes/No)"],["hide","Hide from store (Yes/No)"],["desc","What is inside"],["shelf","Best within"]];
const XM={id:"product id",name:"name",cat:"category",unit:"pack size",price:"base price",cuts:"cutting type",cutAdd:"cutting charge",cutx:"special cut",active:"in stock",hide:"hide",desc:"what is inside",shelf:"best within"};
const XL={name:"Name",cat:"Category",unit:"Pack size",price:"Price",cuts:"Cutting types",cutAdd:"Cutting charge",cutx:"Special cut charges",active:"In stock",hide:"Hidden",desc:"What is inside",shelf:"Best within"};
function loadX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
const pcuts=p=>Array.isArray(p.cuts)?p.cuts.filter(Boolean):[];
const norm=p=>({name:p.name||"",cat:p.cat||"",unit:p.unit||"",price:Number(p.price)||0,cuts:pcuts(p),cutAdd:p.cutAdd===undefined||p.cutAdd===""?5:Number(p.cutAdd),cutx:p.cutx||{},active:p.active!==false,hide:!!p.hide,desc:p.desc||"",shelf:p.shelf||""});
function vBulk(){
 let h='<div class="box bulk"><h2>Bulk update with Excel</h2><p class="hint">Download all your products as an Excel file, change prices, cutting types, stock and more for every product at once, then upload the file back here. Photos are not changed. To add a new product, fill a new row and leave the Product ID empty.</p>'
 +'<div class="row" style="margin-top:10px"><button class="btn s" id="xd">⬇ Download Excel</button><label class="btn s fbtn">⬆ Upload edited Excel<input id="xu" type="file" accept=".xlsx,.xls,.csv"></label></div>';
 if(BM)h+='<p class="msg ok" style="font-weight:700">'+esc(BM)+"</p>";
 if(BU){
  h+='<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><h3>Check before saving: '+esc(BU.file)+"</h3>"
  +"<p><b>"+BU.upd.length+"</b> product"+(BU.upd.length==1?"":"s")+" will be updated, <b>"+BU.add.length+"</b> new product"+(BU.add.length==1?"":"s")+" will be added, "+BU.same+" unchanged.</p>";
  if(BU.err.length)h+='<p class="bad"><b>'+BU.err.length+" row"+(BU.err.length==1?"":"s")+" skipped because of a problem (fix them in Excel and upload again):</b></p><ul class=\"bad\">"+BU.err.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
  if(BU.upd.length)h+="<p><b>Changes:</b></p><ul>"+BU.upd.map(u=>"<li><b>"+esc(u.label)+"</b>: "+esc(u.ch.join(", "))+"</li>").join("")+"</ul>";
  if(BU.add.length)h+="<p><b>New products:</b></p><ul>"+BU.add.map(a=>"<li>"+esc(a.name)+" ("+esc(a.unit)+") ₹"+a.price+"</li>").join("")+"</ul>";
  h+='<div class="row">'+(BU.upd.length||BU.add.length?'<button class="btn" id="xa">Save these changes</button>':"<p>Nothing to save.</p>")+' <button class="btn s" id="xc" style="margin-top:12px">Cancel</button></div></div>';
 }
 return h+"</div>";
}
async function xDown(){
 try{await loadX()}catch(e){alert("Could not load the Excel tool. Check your internet and try again.");return}
 const rows=[XF.map(f=>f[1])].concat(P.map(p=>{const n=norm(p);return[p.id,n.name,n.cat,n.unit,n.price,n.cuts.join(", "),n.cutAdd,Object.entries(n.cutx).filter(([k,v])=>v!==""&&v!=null).map(([k,v])=>k+"="+v).join(", "),n.active?"Yes":"No",n.hide?"Yes":"No",n.desc,n.shelf]}));
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws["!cols"]=[24,24,16,12,12,38,12,26,12,14,34,12].map(w=>({wch:w}));
 ws["!autofilter"]={ref:"A1:L"+rows.length};
 const help=[["How to use this file"],[""],["1. Change anything in the Products sheet: name, category, pack size, price, cutting types, stock and so on."],["2. Do not change or delete the Product ID column. It tells the website which product each row is."],["3. Cutting types: type one or more, separated by commas. Example: Sliced, Small cubes, Round slices"],["   Leave it empty if the product is sold without cutting. You can also type your own, like Thin sticks."],["4. Cutting charge: the extra ₹ added to the base price for every cutting type (usually 5)."],["5. Special cut charges: only if one cut costs a different extra amount. Example: Grated=10, Wedges=8"],["6. In stock / Hide from store: type Yes or No."],["7. New product: add a row at the bottom and leave Product ID empty."],["8. Deleting a row here does NOT delete the product. Delete products in the admin panel."],["9. Save the file, then in the admin panel go to Products > Upload edited Excel, check the list of changes and tap Save these changes."],[""],["Standard cutting types"]].concat(CUTS.map(c=>[c]));
 const wh=XLSX.utils.aoa_to_sheet(help);wh["!cols"]=[{wch:110}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Products");XLSX.utils.book_append_sheet(wb,wh,"How to use");
 XLSX.writeFile(wb,"FreshCut-products-"+new Date().toISOString().slice(0,10)+".xlsx");
}
async function xRead(f){
 BM="";BU=null;
 try{await loadX()}catch(e){alert("Could not load the Excel tool. Check your internet and try again.");return}
 let A;try{const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets.Products||wb.Sheets[wb.SheetNames[0]];A=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true,blankrows:false})}catch(e){alert("Could not read this file. Please upload the Excel file you downloaded from here.");return}
 const hd=(A[0]||[]).map(x=>String(x).trim().toLowerCase()),col={};
 for(const k in XM){const i=hd.findIndex(x=>x.startsWith(XM[k]));if(i>=0)col[k]=i}
 if(col.name===undefined||col.price===undefined){alert("This file does not have the Name and Base price columns. Please use the Excel file downloaded from here.");return}
 const canon=c=>{const m=CUTS.find(x=>x.toLowerCase()==c.toLowerCase());return m||c};
 const yn=(v,def)=>{v=String(v).trim().toLowerCase();if(v==="")return def;if(["yes","y","true","1"].includes(v))return true;if(["no","n","false","0"].includes(v))return false;return null};
 const R={file:f.name,upd:[],add:[],err:[],same:0},seen=new Set();
 for(let r=1;r<A.length;r++){
  const row=A[r],g=k=>col[k]===undefined?undefined:String(row[col[k]]??"").trim();
  if(!row.some(v=>String(v).trim()!==""))continue;
  const at="Row "+(r+1)+(g("name")?" ("+g("name")+")":"")+": ";
  const id=g("id")||"",old=id?P.find(p=>p.id==id):null;
  if(id&&!old){R.err.push(at+"Product ID not found. The product may have been deleted. Clear the ID cell to add it as a new product.");continue}
  if(id&&seen.has(id)){R.err.push(at+"this Product ID appears twice in the file.");continue}
  if(id)seen.add(id);
  const cur=old?norm(old):null,d={},bad=[];
  const name=g("name");if(name!==undefined){if(!name)bad.push("name is empty");d.name=name}
  const price=g("price");if(price!==undefined){const n=Number(price.replace(/[₹,\s]/g,""));if(price===""||isNaN(n)||n<0)bad.push("base price must be a number");else d.price=n}
  if(g("cat")!==undefined)d.cat=g("cat")||"Products";
  if(g("unit")!==undefined)d.unit=g("unit");
  if(g("cuts")!==undefined)d.cuts=[...new Set(g("cuts").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).map(canon))];
  const ca=g("cutAdd");if(ca!==undefined){if(ca==="")d.cutAdd=5;else{const n=Number(ca.replace(/[₹\s]/g,""));if(isNaN(n)||n<0)bad.push("cutting charge must be a number");else d.cutAdd=n}}
  const sx=g("cutx");if(sx!==undefined){const o={};sx.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const i=x.lastIndexOf("=");const n=i>0?Number(x.slice(i+1).replace(/[₹\s]/g,"")):NaN;if(i<1||isNaN(n)||n<0)bad.push('special cut charge "'+x+'" should look like Grated=10');else o[canon(x.slice(0,i).trim())]=n});d.cutx=o}
  const ac=g("active");if(ac!==undefined){const v=yn(ac,true);if(v===null)bad.push("In stock must be Yes or No");else d.active=v}
  const hi=g("hide");if(hi!==undefined){const v=yn(hi,false);if(v===null)bad.push("Hide from store must be Yes or No");else d.hide=v}
  if(g("desc")!==undefined)d.desc=g("desc");
  if(g("shelf")!==undefined)d.shelf=g("shelf");
  if(bad.length){R.err.push(at+bad.join("; ")+".");continue}
  if(old){
   const ch={},names=[];
   for(const k in d)if(JSON.stringify(d[k])!==JSON.stringify(cur[k])){ch[k]=d[k];names.push(k=="price"?"Price ₹"+cur.price+" → ₹"+d.price:k=="cuts"?"Cutting types: "+(d.cuts.join(", ")||"none"):k=="active"?(d.active?"In stock":"Out of stock"):k=="hide"?(d.hide?"Hidden":"Shown"):XL[k])}
   if(names.length)R.upd.push({id,label:(d.name||cur.name)+(cur.unit?" ("+(d.unit??cur.unit)+")":""),ch:names,data:ch});else R.same++;
  }else{
   R.add.push(Object.assign({name:"",cat:"Products",unit:"",price:0,cuts:[],cutAdd:5,cutx:{},active:true,hide:false,desc:"",shelf:"",img:""},d));
  }
 }
 BU=R;
}
async function xApply(){
 const b=$("xa");if(b){b.disabled=true;b.textContent="Saving…"}
 const ops=BU.upd.map(u=>["u",u]).concat(BU.add.map(a=>["a",a]));
 try{
  for(let i=0;i<ops.length;i+=400){const wb=writeBatch(db);ops.slice(i,i+400).forEach(([t,x])=>t=="u"?wb.update(doc(db,"products",x.id),x.data):wb.set(doc(collection(db,"products")),x));await wb.commit()}
  BM="Saved. "+BU.upd.length+" updated, "+BU.add.length+" added. The website is updated.";BU=null;
 }catch(e){console.error(e);alert("Could not save. Nothing was changed. Please check your internet or the Firestore rules and try again.");if(b){b.disabled=false;b.textContent="Save these changes"}return}
 $("view").innerHTML="";draw();
}
const NOCUT="As it is (no cutting)";

 CPL=[...CUTS,...custom];if(P.some(p=>!(Array.isArray(p.cuts)&&p.cuts.length)))CPL.push(NOCUT);
 Object.keys(CP).forEach(k=>{if(!CPL.includes(k))CPL.push(k)});

 return '<div class="box"><h2>Cutting type photos</h2><p class="hint">This is the main picture on each cutting type card in the Shop. Tap Choose photo for a cutting type; it saves straight away. If a cutting type has no photo here, the store uses a product photo, or ✂️ if there is none. Use your own photos, or ones you have the right to use.</p>'

 +'<div class="cpg" style="margin-top:12px">'+CPL.map((c,i)=>{const n=cnt(c);return '<div class="cpc"><div class="ci">'+(CP[c]?'<img src="'+CP[c]+'" alt="">':"✂️")+'</div><div class="cb"><b>'+esc(c)+"</b><small>"+(n?n+" product"+(n>1?"s":""):"Not used by any product yet")+(CP[c]?" · photo set":"")+'</small><div class="row"><label class="btn s fbtn" style="margin:0">'+(CP[c]?"Change photo":"Choose photo")+'<input type="file" accept="image/*" data-cp="'+i+'"></label>'+(CP[c]?'<button class="btn d" data-cpx="'+i+'">Remove</button>':"")+"</div></div></div>"}).join("")+"</div>"
 +'<p class="hint" style="margin-top:10px">Photo storage used: about '+kb+' KB of 900 KB.</p></div>';
}
async function cpSave(next,msg){
 if(JSON.stringify(next).length>900*1024){alert("Too many large photos. Remove one photo, or use smaller photos.");return}
 try{await setDoc(doc(db,"settings","cutphotos"),{imgs:next});CP=next;CPM=msg}
 catch(e){console.error(e);CPM="Could not save. Your Firestore rules may not allow the settings/cutphotos document yet (see the note from Claude)."}
 $("view").innerHTML="";draw();
}

 box.innerHTML=list.map(c=>'<div class="crow"><span>'+esc(c)+'</span><span>Extra ₹ <input class="cutov" type="number" min="0" data-c="'+esc(c)+'" placeholder="auto" value="'+esc(c in old?old[c]:(ex[c]===undefined?"":ex[c]))+'"></span><b class="cfp" data-c="'+esc(c)+'"></b></div>').join("");
 cutPrice();

document.addEventListener("input",e=>{const t=e.target;if(t.id=="pp"||t.id=="pk"||(t.classList&&t.classList.contains("cutov")))cutPrice();if(t.id=="po")cutRows()});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.classList&&t.classList.contains("cutck"))cutRows();
 if(t.dataset.os)await updateDoc(doc(db,"orders",t.dataset.os),{status:t.value});
 if(t.dataset.pa)await updateDoc(doc(db,"products",t.dataset.pa),{active:t.checked});
 if(t.dataset.pr)await updateDoc(doc(db,"products",t.dataset.pr),{price:Number(t.value)||0});
 if(t.dataset.cp!==undefined&&t.files[0]){const c=CPL[+t.dataset.cp];CPM="Saving photo…";const im=await shrink(t.files[0],520,.72);await cpSave({...CP,[c]:im},"Saved. The "+c+" card on the store now shows this photo.")}
 if(t.id=="xu"&&t.files[0]){await xRead(t.files[0]);$("view").innerHTML="";draw()}
 if(t.id=="pf"&&t.files[0]){img=await shrink(t.files[0]);prev()}

});
document.addEventListener("click",async e=>{
 const t=e.target,d=t.dataset||{};
 if(d.od&&confirm("Delete this order?"))await deleteDoc(doc(db,"orders",d.od));
 if(d.pe){editId=d.pe;img="";$("view").innerHTML="";draw();scrollTo(0,0)}
 if(d.pd&&confirm("Delete this product?"))await deleteDoc(doc(db,"products",d.pd));
 if(d.sd&&confirm("Delete this service?"))await deleteDoc(doc(db,"services",d.sd));
 if(d.cpx!==undefined){const c=CPL[+d.cpx];if(confirm("Remove the photo for "+c+"?")){const n={...CP};delete n[c];await cpSave(n,"Photo removed for "+c+".")}}
 if(t.id=="xd")xDown();
 if(t.id=="xa")xApply();
 if(t.id=="xc"){BU=null;$("view").innerHTML="";draw()}
 if(t.id=="pcx"){editId="";img="";$("view").innerHTML="";draw()}
 if(t.id=="ps"){
  const n=$("pn").value.trim();if(!n||$("pp").value===""){alert("Please enter a name and price.");return}
  const old=P.find(p=>p.id==editId)||{};
  const cuts=[...document.querySelectorAll(".cutck:checked")].map(x=>x.value).concat($("po").value.split(",").map(x=>x.trim()).filter(Boolean));
  const cutx={};document.querySelectorAll(".cutov").forEach(i=>{if(i.value!=="")cutx[i.dataset.c]=Number(i.value)});
  const data={cutAdd:$("pk").value===""?5:Number($("pk").value),cutx,name:n,cat:$("pc").value.trim()||"Products",unit:$("pu").value.trim(),price:Number($("pp").value),active:$("pa").checked,hide:$("px").checked,cuts,desc:$("pd").value.trim(),shelf:$("pb").value.trim(),img:img||old.img||""};
  try{if(editId)await setDoc(doc(db,"products",editId),data);else await addDoc(collection(db,"products"),data);
   editId="";img="";$("view").innerHTML="";draw();alert("Saved.")}catch(x){alert("Could not save. If the photo is very large, try a smaller one.")}
 }
 if(t.id=="ss"){const n=$("sn").value.trim();if(!n)return;await addDoc(collection(db,"services"),{name:n,desc:$("sd").value.trim(),price:$("sp").value.trim(),active:true});$("view").innerHTML="";draw()}
 if(t.id=="fv"){await setDoc(doc(db,"settings","site"),{fest:$("fn").value.trim(),pct:Number($("fp").value)||0,start:$("fs").value,end:$("fe").value,wish:$("fw").value.trim(),show:$("fo").checked},{merge:true});$("fm").textContent="Saved. The store is updated."}
 if(t.id=="ibx"){bimg="";bprev()}
 if(t.id=="ibs"){if(bimg===undefined){$("ibm").textContent="Choose a photo first.";return}
  try{await setDoc(doc(db,"settings","site"),{banner:bimg},{merge:true});ST.banner=bimg;bimg=undefined;$("ibm").textContent="Saved. The store banner is updated."}catch(x){alert("Could not save. Try a smaller photo.")}}
 if(t.id=="isv"){await setDoc(doc(db,"settings","site"),{areas:$("ia").value.trim(),delCharge:Number($("ic").value)||0,freeAbove:Number($("if").value)||0,minOrder:Number($("im").value)||0,timings:$("it").value.trim(),cutoff:$("io").value.trim(),about:$("iu").value.trim()},{merge:true});$("im2").textContent="Saved. The store is updated."}
 if(t.id=="rv"){const n=$("rn").value.trim(),x=$("rt").value.trim();if(!n||!x){alert("Please enter the customer name and review.");return}
  const R=[...(Array.isArray(ST.reviews)?ST.reviews:[]),{name:n,area:$("ra").value.trim(),stars:Number($("rs").value),text:x}];
  await setDoc(doc(db,"settings","site"),{reviews:R},{merge:true});ST.reviews=R;$("view").innerHTML="";draw()}

 if(t.id=="seed"&&confirm("Add a few starter products (you can edit prices and photos afterwards)?")){

  for(const r of L)await addDoc(collection(db,"products"),{name:r[0],cat:r[1],unit:r[2],price:r[3],cuts:r[4],desc:r[5]||"",shelf:"2 days",active:true,hide:false,img:""});}
});
function shrink(f,m=600,q=.72){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q))};i.src=URL.createObjectURL(f)})}
